name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - cairo-comp-1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  CARGO_TERM_COLOR: always
  # Make sure CI fails on all warnings, including Clippy lints
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_RUST_2021: true
          VALIDATE_RUST_CLIPPY: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Rust tests
    strategy:
      matrix:
        environment: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v3
      - run: rustup update
      - run: cargo test

  corpus:
    name: OpenZeppelin corpus regression
    runs-on: ubuntu-latest
    env:
      # This job builds OZ's Rust proc-macro package through scarb's cargo;
      # -Dwarnings is not ours to enforce there (clippy covers this repo).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v3
      - run: rustup update
      - uses: Swatinem/rust-cache@v2
      # scripts/corpus.sh installs the pinned scarb itself (version pinned in
      # the script, next to the pinned OZ tag), clones the corpus, runs
      # caracal over it and fails on any drift from
      # tests/corpus/expected_summary.txt.
      - name: Run corpus regression check
        run: ./scripts/corpus.sh
