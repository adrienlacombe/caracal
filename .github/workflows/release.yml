name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        job:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          # Native ARM runner (free for public repos) — no cross-compilation.
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
          # macos-latest runners are arm64; the x86_64 target cross-compiles
          # there with the stock Apple toolchain (universal clang linker).
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.job.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        shell: bash
        run: |
          rustup update stable
          rustup target add ${{ matrix.job.target }}

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Archive binary
        id: binaries
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.job.platform }}
          TARGET: ${{ matrix.job.target }}
        run: |
          if [[ "$PLATFORM_NAME" == linux-* ]]; then
            tar -czvf "caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.tar.gz" -C ./target/${TARGET}/release caracal
            echo "file_name=caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.tar.gz" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM_NAME" == macos-* ]]; then
            gtar -czvf "caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.tar.gz" -C ./target/${TARGET}/release caracal
            echo "file_name=caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.tar.gz" >> $GITHUB_OUTPUT
          else
            cd ./target/${TARGET}/release
            7z a -tzip "caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.zip" caracal.exe
            mv "caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.zip" ../../../
            cd ../../../
            echo "file_name=caracal-${GITHUB_REF_NAME}-${PLATFORM_NAME}.zip" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: caracal-${{ matrix.job.platform }}
          path: ${{ steps.binaries.outputs.file_name }}
          if-no-files-found: error

  # A single job assembles the draft release so concurrent matrix jobs
  # don't race to create duplicate drafts.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
